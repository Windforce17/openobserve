# x86-64-v3 feature tier (2026-08-12, owner call "use SIMD"): AVX2+FMA+BMI
# — every x86 family the fleet runs (m6a/c6a Milan, m7a Genoa, m7i Sapphire
# Rapids) supports it. NO AVX-512: Milan/c6a would SIGILL (the old
# Dockerfile.tag-simd avx512 flags are NOT fleet-safe). Measured on EPYC
# 7R13: +2.3% on the allocation-bound ingest build (the floor); the
# vector-heavy read kernels gain more.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+aes,+sse2,+ssse3,+sse4.1,+sse4.2,+avx,+avx2,+fma,+bmi1,+bmi2,+lzcnt,+popcnt,+movbe", "-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+aes,+sse2,+ssse3,+sse4.1,+sse4.2"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-feature=+aes,+neon"]

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = ["-C", "target-feature=+aes,+neon"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-feature=+aes,+neon"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+aes,+sse2,+ssse3,+sse4.1,+sse4.2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+aes,+sse2,+ssse3,+sse4.1,+sse4.2"]
